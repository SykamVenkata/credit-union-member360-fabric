[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditunion-member360"
version = "2.0.0"
description = "Credit union Member 360 on Microsoft Fabric: identity resolution, features, churn and next-best-product models, AML monitoring and copilot context."
requires-python = ">=3.10"
dependencies = ["pandas>=2", "numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["fabric"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402", "E731", "B905", "B023"]
